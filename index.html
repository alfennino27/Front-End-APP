<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/klflogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KLF Project Manager</title>
    <!-- CSS & JS Bootstrap dibundel dari npm (src/main.jsx), bukan CDN: dulu CSS-nya
         terunduh dua kali dan script react-bootstrap@next dari CDN selalu 404. -->
    <link rel="preconnect" href="https://api.karyalogamfurniture.com" crossorigin />

    <style>
      body {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        margin: 0;
        padding: 0;
        height: 100vh;
      }
    </style>

    <script type="text/javascript">
      // Fungsi untuk mengubah background berdasarkan tema
      function updateBackground(theme) {
        if (theme === 'light') {
          document.body.style.backgroundImage = "url('/assets/background/Abstract-Plain-White-Wallpaper-.jpg')";
        } else {
          document.body.style.backgroundImage = "url('/assets/background/bg-dark.webp')";
        }
      }

      // Pada awal load, atur background sesuai dengan localStorage
      document.addEventListener('DOMContentLoaded', function () {
        const savedTheme = localStorage.getItem('theme') || 'light';
        updateBackground(savedTheme);
      });

      // Event listener untuk perubahan tema dari React
      window.addEventListener('themeChange', function (e) {
        const newTheme = e.detail;
        updateBackground(newTheme);
        localStorage.setItem('theme', newTheme); // Simpan tema ke localStorage
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
